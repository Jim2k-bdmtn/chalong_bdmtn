<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Chalong Badminton Court League</title>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --ink: #1b1f24;
  --muted: #5f6b7a;
  --line: #e2e6ea;
  --accent: #1f6feb;
  --accent-ink: #ffffff;
  --win: #1a8f4c;
  --loss: #d1373b;
  --win-bg: #e3f5ea;
  --loss-bg: #fbe5e6;
  --warn-bg: #fff4d6;
  --warn-ink: #7a5a00;
  --radius: 12px;
  --tap: 44px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; height: 52px;
  background: var(--card); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 17px; color: var(--ink); }


.app { max-width: 720px; margin: 0 auto; padding: 14px 12px 40px; }
.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 0 30px; }

h1 { font-size: 22px; margin: 6px 0 12px; }
h2 { font-size: 17px; margin: 22px 0 8px; display: flex; align-items: center; gap: 6px; }
h2:first-child { margin-top: 4px; }
.sub { color: var(--muted); font-size: 14px; margin: -4px 0 10px; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; margin-bottom: 12px;
}

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--card); margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 9px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted);
  background: var(--card); position: sticky; top: 0; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.row-link { cursor: pointer; }
tr.row-link:active { background: var(--bg); }
tr.me td { background: #eef4ff; }
.sticky-col { position: sticky; left: 0; background: var(--card); z-index: 1; }
tr.me .sticky-col { background: #eef4ff; }

.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
  background: var(--warn-bg); color: var(--warn-ink); vertical-align: middle; }
.badge.win { background: var(--win-bg); color: var(--win); }
.badge.loss { background: var(--loss-bg); color: var(--loss); }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
@media (min-width: 480px) { .stats { grid-template-columns: repeat(3, 1fr); } }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.stat .value { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .value small { font-size: 13px; font-weight: 500; color: var(--muted); }
.stat.win .value { color: var(--win); }
.stat.loss .value { color: var(--loss); }

.form { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.pill { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.pill.W { background: var(--win); }
.pill.L { background: var(--loss); }

.pos { color: var(--win); font-weight: 600; }
.neg { color: var(--loss); font-weight: 600; }

/* tooltips */
.tip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; margin-left: 2px; border: none; border-radius: 50%;
  background: transparent; color: var(--accent); font-size: 15px; cursor: pointer; padding: 0;
  position: relative; vertical-align: middle;
}
.tip:active { background: var(--bg); }
.tip-pop {
  position: fixed; z-index: 30; left: 0;
  background: var(--ink); color: #fff; font-size: 14px; line-height: 1.4; font-weight: 400;
  padding: 10px 12px; border-radius: 10px; max-width: min(340px, calc(100vw - 32px));
  box-shadow: 0 6px 20px rgba(0,0,0,.25); text-transform: none; letter-spacing: 0; white-space: normal;
  text-align: left;
}
.tip-pop .th { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.25); color: #d6dde6; }
.tip-pop .th::before { content: "TH "; font-size: 11px; font-weight: 700; letter-spacing: .05em; color: #9fb3c8; }
.tip-host { position: relative; }

/* player picker */
.search {
  width: 100%; height: var(--tap); padding: 0 14px; font-size: 16px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink);
  margin-bottom: 10px;
}
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.picker a {
  display: flex; align-items: center; justify-content: space-between; min-height: var(--tap);
  padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  color: var(--ink);
}
.picker a small { color: var(--muted); }

/* match cards */
.match { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; margin-bottom: 8px; }
.match .head { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
.match .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 6px 0; }
.match .team { display: flex; flex-direction: column; gap: 2px; }
.match .team.right { text-align: right; align-items: flex-end; }
.match .team a { color: var(--ink); }
.match .team.won a { font-weight: 700; color: var(--win); }
.match .score { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.match .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.chart { width: 100%; height: 280px; }
.chart.tall { height: 340px; }
.empty { color: var(--muted); padding: 12px; text-align: center; }
.streak-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.streak-row:last-child { border-bottom: none; }
.streak-row .who { font-weight: 600; }
.streak-row .len { font-variant-numeric: tabular-nums; font-weight: 700; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two-col + .sub { margin-top: -2px; }
@media (max-width: 420px) { .two-col { grid-template-columns: 1fr; } }

/* matchup predictor */
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
.matchup .vs { align-self: center; font-weight: 700; color: var(--muted); padding-top: 18px; }
.matchup .pair { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.matchup .pair .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.matchup select {
  width: 100%; min-width: 0; height: var(--tap); padding: 0 8px; font: inherit; font-size: 15px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
}
.matchup .avg { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
.matchup-result { margin-top: 12px; }
.matchup-result .pcts { display: flex; justify-content: space-between; font-size: 24px; font-weight: 700;
  font-variant-numeric: tabular-nums; }
.matchup-result .bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; margin: 6px 0; background: var(--line); }
.matchup-result .bar .a { background: var(--accent); }
.matchup-result .bar .b { background: var(--loss); }
.matchup-result .deltas { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.matchup-result .msg { color: var(--muted); text-align: center; padding: 8px 0 0; font-size: 14px; }
.matchup-result .a-ink { color: var(--accent); }
.matchup-result .b-ink { color: var(--loss); }

</style>

matchup_sub: "เลือกสองคู่ แล้วดูโอกาสชนะของแต่ละคู่จากคะแนน Elo วันนี้",
tip_matchup: "โอกาสชนะคำนวณจาก Elo ปัจจุบันของผู้เล่นทั้งสี่คน ด้วยวิธีเดียวกับที่ใช้ก่อนทุกแมตช์จริง ผู้เล่นอันดับชั่วคราวใช้คะแนนปัจจุบันของตน",
  }
};

/* Plain-JS viewer. All numbers come precomputed in the embedded JSON; this file only renders. */
(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('data').textContent);
  const CFG = DATA.config;
  const PLAYER_NAMES = Object.keys(DATA.players).sort((a, b) => a.localeCompare(b));
  const MATCH_BY_ID = {};
  DATA.matches.forEach(m => { MATCH_BY_ID[m.id] = m; });

  const $app = document.getElementById('app');

  /* ---------- strings ---------- */
  function fill(s, vars) {
    return s.replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null) ? vars[k] : m);
  }
  function t(key, vars) {
    const s = I18N.en[key];
    return s == null ? key : fill(s, vars);
  }
  function tTh(key, vars) {
    const s = I18N.th[key];
    return s == null ? '' : fill(s, vars);
  }
  function applyStatic() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.title = t('title');
  }

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = x => (x == null ? t('none') : Math.round(x * 100) + '%');
  const signed = (x, d) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d == null ? 1 : d);
  const signedCls = x => (x > 0 ? 'pos' : x < 0 ? 'neg' : '');
  const hashFor = name => '#' + encodeURIComponent(name);
  const link = name => `<a href="${hashFor(name)}">${esc(name)}</a>`;
  const tip = (key, vars) => `<button type="button" class="tip" data-en="${esc(t(key, vars))}" data-th="${esc(tTh(key, vars))}" aria-label="info">ⓘ</button>`;
  const provisionalBadge = () => `<span class="badge">${esc(t('provisional'))}</span>`;

  /* ---------- tooltips: tap to toggle, tap anywhere else to close.
     Each popup shows the English explanation and the Thai version underneath. ---------- */
  const pop = document.createElement('div');
  pop.className = 'tip-pop';
  pop.hidden = true;
  document.body.appendChild(pop);
  let openTip = null;

  function closeTip() { pop.hidden = true; openTip = null; }
  function showTip(btn) {
    pop.innerHTML = `<div class="en">${esc(btn.dataset.en)}</div>` +
      (btn.dataset.th ? `<div class="th">${esc(btn.dataset.th)}</div>` : '');
    pop.hidden = false;
    const r = btn.getBoundingClientRect();
    let left = r.left;
    const w = pop.offsetWidth;
    if (left + w > window.innerWidth - 8) left = window.innerWidth - 8 - w;
    pop.style.left = Math.max(8, left) + 'px';
    pop.style.top = (r.bottom + 6) + 'px';
    openTip = btn;
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest('.tip');
    if (btn && btn !== openTip) { e.preventDefault(); showTip(btn); return; }
    closeTip();
  });
  window.addEventListener('scroll', closeTip, { passive: true });

  /* ---------- charts ---------- */
  function noPlotly(id) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<div class="empty">Charts need an internet connection.</div>';
  }
  const BASE_LAYOUT = {
    margin: { l: 44, r: 12, t: 8, b: 40 },
    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: '#fff',
    font: { size: 12, family: 'system-ui, sans-serif' },
    hovermode: 'closest',
  };
  const PLOT_CFG = { responsive: true, displayModeBar: false };

  function lineChart(id, hist, color) {
    if (!window.Plotly) return noPlotly(id);
    const el = document.getElementById(id);
    if (!el) return;
    if (!hist.length) { el.innerHTML = `<div class="empty">${esc(t('never_played'))}</div>`; return; }
    Plotly.newPlot(el, [{
      x: hist.map(h => h.date), y: hist.map(h => h.value),
      mode: 'lines+markers', line: { color, width: 2 }, marker: { size: 5 },
      hovertemplate: '%{x}<br>%{y}<extra></extra>',
    }], Object.assign({}, BASE_LAYOUT, { xaxis: { type: 'date' }, yaxis: { zeroline: true } }), PLOT_CFG);
  }

  const RACE_COLORS = ['#1f6feb', '#d1373b', '#1a8f4c', '#c9a227', '#7c3aed', '#0891b2', '#ea580c'];
  function pointsRaceChart(id) {
    if (!window.Plotly) return noPlotly(id);
    const el = document.getElementById(id);
    if (!el) return;
    const names = DATA.leaderboard_points.slice(0, CFG.top_points_chart);
    if (!names.length) { el.innerHTML = `<div class="empty">${esc(t('none_yet'))}</div>`; return; }
    const traces = names.map((name, i) => {
      const h = DATA.players[name].points_history;
      return {
        name, x: h.map(p => p.date), y: h.map(p => p.value),
        mode: 'lines', line: { color: RACE_COLORS[i % RACE_COLORS.length], width: 2, shape: 'hv' },
        hovertemplate: '<b>' + esc(name) + '</b><br>%{x}<br>%{y} pts<extra></extra>',
      };
    });
    Plotly.newPlot(el, traces, Object.assign({}, BASE_LAYOUT, {
      margin: { l: 36, r: 12, t: 8, b: 40 },
      xaxis: { type: 'date' }, yaxis: { zeroline: true, title: { text: t('points') } },
      legend: { orientation: 'h', y: -0.25, x: 0, font: { size: 12 } },
      hovermode: 'closest',
    }), PLOT_CFG);
  }

  /* ---------- match card ---------- */
  function matchCard(m, focus) {
    const won = team => (team === m.winner);
    const teamHtml = (names, side) => `
      <div class="team ${side} ${won(side === 'left' ? 'A' : 'B') ? 'won' : ''}">
        ${names.map(n => `<span>${n === focus ? `<b>${esc(n)}</b>` : link(n)} <small class="${signedCls(m.deltas[n])}">${signed(m.deltas[n])}</small></span>`).join('')}
      </div>`;
    const score = (m.score_a == null) ? `<span class="score" style="font-size:14px;color:var(--muted)">vs</span>`
      : `<span class="score">${m.score_a}–${m.score_b}</span>`;
    // For a focused player show *their* team's chance; otherwise the winners' chance. Both by today's Elo,
    // the same chance the match points come from.
    const chance = focus ? (m.a.includes(focus) ? m.p_a : 1 - m.p_a) : m.winner_prob;
    return `
      <div class="match">
        <div class="head"><span>${esc(m.date)}</span><span>#${m.id}</span></div>
        <div class="teams">${teamHtml(m.a, 'left')}${score}${teamHtml(m.b, 'right')}</div>
        <div class="meta"><span>${esc(t('win_chance'))} ${pct(chance)}</span><span>Elo ${tip('tip_delta', { carry: Math.round(CFG.level_carry_weight * 100) })}</span></div>
      </div>`;
  }

  /* ---------- views ---------- */
  function streakList(rows, cls) {
    if (!rows.length) return `<div class="empty">${esc(t('none_yet'))}</div>`;
    return rows.map(r => `<div class="streak-row"><span class="who">${link(r.name)}</span><span class="len ${cls}">${esc(t('streak_n', { n: r.len }))}</span></div>`).join('');
  }
  function formList(rows) {
    if (!rows.length) return `<div class="empty">${esc(t('none_yet'))}</div>`;
    return rows.map(r => `<div class="streak-row"><span class="who">${link(r.name)} <small style="color:var(--muted)">${r.matches}${r.matches === 1 ? ' match' : ' matches'}</small></span><span class="len ${signedCls(r.delta)}">${signed(r.delta, 0)}</span></div>`).join('');
  }
  function rankGapList(rows) {
    if (!rows.length) return `<div class="empty">${esc(t('none_yet'))}</div>`;
    return rows.map(r => `<div class="streak-row"><span class="who">${link(r.name)}</span><span class="len" style="font-weight:500;color:var(--muted);font-size:13px">${esc(t('rank_pair', { e: r.rank_elo, p: r.rank_points }))}</span></div>`).join('');
  }
  function winRateList(rows) {
    if (!rows.length) return `<div class="empty">${esc(t('none_yet'))}</div>`;
    return rows.map(r => `<div class="streak-row"><span class="who">${link(r.name)} <small style="color:var(--muted)">${r.wins}-${r.losses}</small></span><span class="len">${pct(r.win_rate)}</span></div>`).join('');
  }
  function twoCol(leftTitle, leftTip, leftBody, rightTitle, rightTip, rightBody) {
    return `<div class="two-col">
        <div><h2>${esc(leftTitle)}${leftTip}</h2><div class="card">${leftBody}</div></div>
        <div><h2>${esc(rightTitle)}${rightTip}</h2><div class="card">${rightBody}</div></div>
      </div>`;
  }

  /* ---------- matchup predictor: two pairs, win chance from today's Elo ---------- */
  const MATCHUP_MIN_MATCHES = 5;
  function randomMatchup() {
    // Four different players with at least MATCHUP_MIN_MATCHES matches, shuffled (Fisher-Yates).
    const pool = PLAYER_NAMES.filter(n => DATA.players[n].matches >= MATCHUP_MIN_MATCHES);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 4);
  }
  function matchupPair(team, saved) {
    const sel = i => {
      const cur = saved[team * 2 + i] || '';
      const opts = PLAYER_NAMES.map(n => {
        const p = DATA.players[n];
        const label = `${n} · ${Math.round(p.elo)}${p.provisional ? ' (' + t('provisional') + ')' : ''}`;
        return `<option value="${esc(n)}"${n === cur ? ' selected' : ''}>${esc(label)}</option>`;
      }).join('');
      return `<select data-slot="${team * 2 + i}" aria-label="${esc(t('matchup_team', { n: team + 1 }))}">
        <option value="">${esc(t('matchup_pick'))}</option>${opts}</select>`;
    };
    return `<div class="pair"><div class="label">${esc(t('matchup_team', { n: team + 1 }))}</div>${sel(0)}${sel(1)}<div class="avg" data-avg="${team}"></div></div>`;
  }
  function initMatchup() {
    const sels = Array.from($app.querySelectorAll('.matchup select'));
    const out = document.getElementById('matchup-result');
    const avgEl = i => $app.querySelector(`[data-avg="${i}"]`);
    function update() {
      const names = sels.map(s => s.value);
      const team = i => names.slice(i * 2, i * 2 + 2).filter(Boolean).map(n => DATA.players[n]);
      // Same pair rating as the build (level.team_rating): plain average for equal partners,
      // leaning towards the stronger one as the gap grows.
      const k = CFG.level_carry_weight - 0.5, s = CFG.level_carry_smooth;
      const pair = ps => ps.length < 2 ? ps[0].elo
        : (ps[0].elo + ps[1].elo) / 2 + k * (Math.hypot(ps[0].elo - ps[1].elo, s) - s);
      [0, 1].forEach(i => { const ps = team(i); avgEl(i).textContent = ps.length ? `${t('matchup_avg')} ${Math.round(pair(ps))}` : ''; });
      const picked = names.filter(Boolean);
      const dup = picked.find((n, i) => picked.indexOf(n) !== i);
      if (dup) { out.innerHTML = `<div class="msg">${esc(t('matchup_dup', { name: dup }))}</div>`; return; }
      if (picked.length < 4) { out.innerHTML = `<div class="msg">${esc(t('matchup_need_four'))}</div>`; return; }
      const A = team(0), B = team(1);
      const ra = pair(A), rb = pair(B);
      const pa = 1 / (1 + Math.pow(10, (rb - ra) / 400));
      const pctA = Math.round(pa * 100), pctB = 100 - pctA;
      out.innerHTML = `
        <div class="pcts"><span class="a-ink">${pctA}%</span><span class="b-ink">${pctB}%</span></div>
        <div class="bar"><div class="a" style="width:${pa * 100}%"></div><div class="b" style="flex:1"></div></div>`;
    }
    sels.forEach(s => s.addEventListener('change', update));
    update();
  }

  function renderHome() {
    const randomPick = randomMatchup();
    const rows = DATA.leaderboard_points.map(name => {
      const p = DATA.players[name];
      const eloRank = p.rank_elo != null ? p.rank_elo : provisionalBadge();
      return `<tr class="row-link" data-player="${esc(name)}">
        <td class="num">${p.rank_points}</td>
        <td class="sticky-col"><b>${esc(name)}</b></td>
        <td class="num"><b>${p.points > 0 ? '+' : ''}${p.points}</b></td>
        <td class="num">${p.wins}-${p.losses}</td>
        <td class="num">${Math.round(p.elo)}</td>
        <td class="num">${eloRank}</td></tr>`;
    }).join('');

    const lastMatches = DATA.matches.slice(-CFG.home_last_matches).reverse().map(m => matchCard(m)).join('');

    const upsets = DATA.upsets.filter(u => !u.provisional).slice(0, CFG.home_upsets).map(u => `
      <div class="match">
        <div class="head"><span>${esc(u.date)}</span><span>${esc(t('win_chance'))} <b>${pct(u.winner_prob)}</b> ${u.provisional ? provisionalBadge() : ''}</span></div>
        <div style="margin-top:4px">${u.winners.map(link).join(' & ')} <span style="color:var(--muted)">${esc(t('beat'))}</span> ${u.losers.map(link).join(' & ')}</div>
      </div>`).join('');

    $app.innerHTML = `
      <h1>${esc(t('leaderboard'))}</h1>
      <p class="sub">${esc(t('leaderboard_sub'))} <b>${esc(t('leaderboard_tap'))}</b><br>${esc(tTh('leaderboard_sub'))}</p>
      <div class="table-wrap"><table>
        <thead><tr><th class="num">${esc(t('rank'))}</th><th class="sticky-col">${esc(t('player'))}</th>
          <th class="num">${esc(t('points'))}${tip('tip_points')}</th>
          <th class="num">${esc(t('record'))}${tip('tip_record')}</th>
          <th class="num">${esc(t('elo'))}${tip('tip_elo', { start: CFG.start_rating })}</th>
          <th class="num">${esc(t('elo_rank'))}${tip('tip_elo_rank', { n: CFG.provisional_until })}</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="empty">${esc(t('no_matches'))}</td></tr>`}</tbody>
      </table></div>

      <h2>${esc(t('last_matches'))}</h2>
      <p class="sub">${esc(t('last_matches_sub', { n: CFG.home_last_matches }))}<br>${esc(tTh('last_matches_sub', { n: CFG.home_last_matches }))}</p>
      ${lastMatches || `<div class="empty">${esc(t('no_matches'))}</div>`}

      <h2>${esc(t('matchup'))}${tip('tip_matchup')}</h2>
      <p class="sub">${esc(t('matchup_sub'))}<br>${esc(tTh('matchup_sub'))}</p>
      <div class="card">
        <div class="matchup">
          ${matchupPair(0, randomPick)}
          <div class="vs">vs</div>
          ${matchupPair(1, randomPick)}
        </div>
        <div class="matchup-result" id="matchup-result"></div>
      </div>

      <h2>${esc(t('upsets'))}${tip('tip_upsets')}</h2>
      <p class="sub">${esc(t('upsets_sub', { n: CFG.provisional_until }))}</p>
      ${upsets || `<div class="empty">${esc(t('no_matches'))}</div>`}

      ${twoCol(t('form_up'), tip('tip_form_up', { n: CFG.form_global_matches }), formList(DATA.form_up),
               t('form_down'), tip('tip_form_down', { n: CFG.form_global_matches }), formList(DATA.form_down))}
      <p class="sub">${esc(t('form_sub', { n: DATA.form_span.matches, from: DATA.form_span.from, to: DATA.form_span.to }))}</p>

      ${twoCol(t('streaks_win'), tip('tip_streaks_win'), streakList(DATA.streaks_win, 'pos'),
               t('streaks_loss'), tip('tip_streaks_loss'), streakList(DATA.streaks_loss, 'neg'))}

      <div class="two-col">
        <div><h2>${esc(t('win_rate_best'))}${tip('tip_win_rate_best', { n: CFG.min_win_rate_matches })}</h2>
          <div class="card">${winRateList(DATA.win_rate_best)}</div></div>
      </div>
      <p class="sub">${esc(t('win_rate_sub', { n: CFG.min_win_rate_matches }))}</p>

      ${twoCol(t('elo_over_points'), tip('tip_elo_over_points'), rankGapList(DATA.elo_over_points),
               t('points_over_elo'), tip('tip_points_over_elo'), rankGapList(DATA.points_over_elo))}
      <p class="sub">${esc(t('rank_gap_sub', { n: CFG.min_rank_gap_matches }))}</p>

      <h2>${esc(t('points_race'))}${tip('tip_points_race')}</h2>
      <p class="sub">${esc(t('points_race_sub', { n: CFG.top_points_chart }))}</p>
      <div class="card"><div id="points-race" class="chart tall"></div></div>`;

    $app.querySelectorAll('tr.row-link').forEach(tr => {
      tr.addEventListener('click', e => { if (!e.target.closest('.tip')) location.hash = hashFor(tr.dataset.player); });
    });
    initMatchup();
    pointsRaceChart('points-race');
  }

  function renderPlayers(notFound) {
    const list = PLAYER_NAMES.map(name => {
      const p = DATA.players[name];
      const sub = p.matches ? `${Math.round(p.elo)} · ${p.wins}-${p.losses}` : esc(t('never_played'));
      return `<a href="${hashFor(name)}" data-name="${esc(name.toLowerCase())}">${esc(name)}<small>${sub}</small></a>`;
    }).join('');
    $app.innerHTML = `
      <p><a href="#home">${esc(t('back_home'))}</a></p>
      <h1>${esc(t('pick_player'))}</h1>
      ${notFound ? `<div class="card" style="background:var(--warn-bg);color:var(--warn-ink)">${esc(t('player_not_found', { name: notFound }))}</div>` : ''}
      <input id="search" class="search" type="search" autocomplete="off" placeholder="${esc(t('search_placeholder'))}">
      <div class="picker" id="picker">${list}</div>
      <div class="empty" id="no-results" hidden>${esc(t('no_results'))}</div>`;
    const input = document.getElementById('search');
    const items = Array.from(document.querySelectorAll('#picker a'));
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      let shown = 0;
      items.forEach(a => { const hit = !q || a.dataset.name.includes(q); a.hidden = !hit; shown += hit; });
      document.getElementById('no-results').hidden = shown > 0;
    });
    if (!notFound) input.focus({ preventScroll: true });
  }

  function statCard(label, value, opts) {
    opts = opts || {};
    return `<div class="stat ${opts.cls || ''}"><div class="label">${esc(label)}${opts.tip || ''}</div><div class="value">${value}</div></div>`;
  }

  function renderPlayer(name) {
    const p = DATA.players[name];
    const streak = p.streak_current.type
      ? `<span class="${p.streak_current.type === 'W' ? 'pos' : 'neg'}">${p.streak_current.len}${p.streak_current.type}</span>` : t('none');
    const form = p.form.length ? `<div class="form">${p.form.map(r => `<span class="pill ${r}">${r}</span>`).join('')}</div>` : t('none');
    const eloVal = `${Math.round(p.elo)} <small>${p.rank_elo != null ? '#' + p.rank_elo : esc(t('unranked'))}</small>`;
    const pointsVal = `${p.points > 0 ? '+' : ''}${p.points} <small>${p.rank_points != null ? '#' + p.rank_points : ''}</small>`;

    const partners = p.partners.map(x => `<tr>
        <td class="sticky-col">${link(x.name)}</td><td class="num">${x.matches}</td><td class="num">${x.wins}</td>
        <td class="num">${pct(x.win_rate)}</td><td class="num">${x.expected_wins.toFixed(1)}</td>
        <td class="num ${signedCls(x.diff)}">${signed(x.diff)}</td></tr>`).join('');

    const oppCard = (label, key, o) => statCard(label,
      o ? `${link(o.name)} <small>${o.wins}-${o.losses}</small>` : `<small>${esc(t('none'))}</small>`,
      { tip: tip(key, { n: CFG.min_opponent_matches }) });

    const cards = items => items.map(x => matchCard(MATCH_BY_ID[x.match_id], name)).join('') || `<div class="card empty">${esc(t('none_yet'))}</div>`;
    const recent = DATA.matches.filter(m => m.a.includes(name) || m.b.includes(name)).slice(-3).reverse();

    $app.innerHTML = `
      <p><a href="#home">${esc(t('back_home'))}</a></p>
      <h1>${esc(name)} ${p.provisional ? provisionalBadge() : ''}</h1>
      <div class="stats">
        ${statCard(t('matches'), p.matches)}
        ${statCard(t('record'), `${p.wins}-${p.losses}`, { tip: tip('tip_record') })}
        ${statCard(t('win_rate'), pct(p.win_rate), { tip: tip('tip_win_rate') })}
        ${statCard(t('points'), pointsVal, { tip: tip('tip_points') })}
        ${statCard(t('elo_rating'), eloVal, { tip: tip('tip_elo', { start: CFG.start_rating }) })}
        ${statCard(t('current_streak'), streak, { tip: tip('tip_streak') })}
        ${statCard(t('longest_win'), p.longest_win, { cls: 'win' })}
        ${statCard(t('longest_loss'), p.longest_loss, { cls: 'loss' })}
        ${statCard(t('last_played'), p.last_played ? esc(p.last_played) : t('none'))}
        ${statCard(t('form_delta', { n: CFG.form_window }), p.form_delta == null ? t('none') : `<span class="${signedCls(p.form_delta)}">${signed(p.form_delta, 0)}</span>`, { tip: tip('tip_form_delta', { n: CFG.form_window }) })}
        ${statCard(t('peak_elo'), p.peak_elo ? `${Math.round(p.peak_elo.value)} <small>${esc(p.peak_elo.date)}</small>` : t('none'), { tip: tip('tip_peak_elo') })}
        ${statCard(t('low_elo'), p.low_elo ? `${Math.round(p.low_elo.value)} <small>${esc(p.low_elo.date)}</small>` : t('none'), { tip: tip('tip_low_elo') })}
        ${statCard(t('avg_opponent'), p.avg_opponent_elo == null ? t('none') : Math.round(p.avg_opponent_elo), { tip: tip('tip_avg_opponent') })}
        ${statCard(t('avg_partner'), p.avg_partner_elo == null ? t('none') : Math.round(p.avg_partner_elo), { tip: tip('tip_avg_partner') })}
      </div>
      <div class="card"><div class="label" style="font-size:12px;color:var(--muted)">${esc(t('form', { n: CFG.form_length }))}${tip('tip_form', { n: CFG.form_length })}</div>${form}</div>

      <h2>${esc(t('points_chart'))}</h2>
      <div class="card"><div id="points-chart" class="chart"></div></div>

      <h2>${esc(t('partners'))}</h2>
      ${partners ? `<div class="table-wrap"><table>
        <thead><tr><th class="sticky-col">${esc(t('partner'))}</th><th class="num">${esc(t('matches_short'))}</th><th class="num">${esc(t('wins_short'))}</th>
          <th class="num">${esc(t('win_rate'))}</th><th class="num">${esc(t('expected'))}${tip('tip_expected')}</th><th class="num">${esc(t('diff'))}${tip('tip_diff')}</th></tr></thead>
        <tbody>${partners}</tbody></table></div>`
        : `<div class="card empty">${esc(t('no_partners'))}</div>`}

      <h2>${esc(t('opponents'))}</h2>
      <div class="stats">
        ${oppCard(t('most_faced'), 'tip_most_faced', p.most_faced)}
        ${oppCard(t('nemesis'), 'tip_nemesis', p.nemesis)}
        ${oppCard(t('victim'), 'tip_victim', p.victim)}
      </div>

      <h2>${esc(t('hardest_wins'))}${tip('tip_hardest_wins')}</h2>
      ${cards(p.hardest_wins)}
      <h2>${esc(t('easiest_losses'))}${tip('tip_easiest_losses')}</h2>
      ${cards(p.easiest_losses)}

      <h2>${esc(t('recent_matches'))}</h2>
      ${recent.map(m => matchCard(m, name)).join('') || `<div class="card empty">${esc(t('none_yet'))}</div>`}
      `;

    lineChart('points-chart', p.points_history, '#1a8f4c');
  }

  /* ---------- router ---------- */
  let lastPath = null;
  function route(keepScroll) {
    closeTip();
    const raw = location.hash.slice(1);
    const qIdx = raw.indexOf('?');
    const pathRaw = qIdx >= 0 ? raw.slice(0, qIdx) : raw;
    const q = new URLSearchParams(qIdx >= 0 ? raw.slice(qIdx + 1) : '');
    let path;
    try { path = decodeURIComponent(pathRaw); } catch (e) { path = pathRaw; }
    if (!path) path = 'home';

    let tab;
    if (path === 'home') { tab = 'home'; renderHome(); }
    else if (path === 'players') { tab = 'players'; renderPlayers(null); }
    else if (DATA.players[path]) { tab = 'players'; renderPlayer(path); }
    else { tab = 'players'; renderPlayers(path); }

    if (!keepScroll && path !== lastPath) window.scrollTo(0, 0);
    lastPath = path;
  }

  window.addEventListener('hashchange', () => route(false));
  document.getElementById('generated-at').textContent = DATA.generated_at;
  applyStatic();
  route(false);
})();

</script>
</body>
</html>
